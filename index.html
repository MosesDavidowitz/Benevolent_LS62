<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benevolent LS62 Generator v1.0</title><style>body{font-family:Arial;background:#f5f7fb;margin:0}header{background:#0d4c8f;color:#fff;padding:18px;text-align:center}.c{max-width:1000px;margin:20px auto;background:#fff;padding:20px;border-radius:10px}label{display:block;margin-top:8px;font-weight:bold}input{padding:8px;width:100%}.ro{background:#eee}pre{background:#f0f0f0;padding:10px}</style></head><body><header><h2>Benevolent LS62 Generator</h2><div>Prototype v1.0</div></header><div class="c"><label>Minimum Wage</label><input id="mw" type="number" step="0.01" value="19.65"><label>Wage Parity</label><input id="wp" type="number" step="0.01" value="2.54"><label><input id="ovr" type="checkbox"> Override Rate</label><label>Base Rate</label><input id="base" type="number" step="0.01" value="19.65"><label>Total</label><input id="total" class="ro" readonly><label>PTO</label><input id="pto" class="ro" readonly><label>Supplemental</label><input id="supp" class="ro" readonly><label>SOH</label><input id="soh" class="ro" readonly><pre id="p"></pre></div><script>const g=id=>document.getElementById(id);function r(v){return Math.round(v*100)/100}function c(){let mw=+g("mw").value||0,wp=+g("wp").value||0,t=r(mw+wp);g("total").value=t.toFixed(2);if(!g("ovr").checked){g("base").readOnly=true;g("base").value=mw.toFixed(2)}else g("base").readOnly=false;let b=Math.min(Math.max(+g("base").value,mw),t);g("base").value=b.toFixed(2);let p=r(b/30),s=r(Math.max(0,t-b-p)),soh=r(b+mw/12);g("pto").value=p.toFixed(2);g("supp").value=s.toFixed(2);g("soh").value=soh.toFixed(2);g("p").textContent=`Regular: ${b.toFixed(2)}\nSOH: ${soh.toFixed(2)}\nIn-Service: ${mw.toFixed(2)}\nPTO: ${p.toFixed(2)}\nSupplemental: ${s.toFixed(2)}`;}["mw","wp","base","ovr"].forEach(i=>g(i).addEventListener("input",c));c();</script></body></html>
